[package]
name = "deskhub_core_rust"
version = "1.1.3"
edition = "2021"
authors = ["DeskHub Systems Engineering Team"]
description = "Zero-overhead native Rust acceleration engine for DeskHub Emulator (GameHub v6.1.1 runtime)"
license = "MIT OR Apache-2.0"

[lib]
name = "deskhub_core_rust"
crate-type = ["staticlib", "cdylib"]

[dependencies]
memmap2 = "0.9"
zstd = { version = "0.13", default-features = false }
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
libc = "0.2"
log = "0.4"
android_logger = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = "symbols"
debug = false
incremental = false
