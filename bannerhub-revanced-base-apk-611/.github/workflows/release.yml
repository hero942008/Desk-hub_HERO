name: Release DeskHub Emulator APK

# Automatically builds and produces APKs on every push to github (branches and tags)
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.3.0"). Strip leading v; the workflow re-adds it for the git tag.'
        required: false
        default: "1.3.0"
      stable:
        description: "Cut a stable GitHub Release (default: true)."
        type: boolean
        default: true

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]] || [[ "${GITHUB_REF_NAME}" == DeskHub-* ]] || [[ "${GITHUB_REF_NAME}" == BannerHub-* ]] || [[ "${GITHUB_REF_NAME}" == GameHub-* ]]; then
            RAW="${GITHUB_REF_NAME#v}"
            RAW="${RAW#DeskHub-}"
            RAW="${RAW#BannerHub-}"
            RAW="${RAW#GameHub-}"
          else
            RAW="1.3.0"
          fi
          VERSION="${RAW#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v5

      # libevshim.so build step removed — the vibration patch is now
      # preload-free (in-process winebus.so disk patch via
      # BhVibrationController.ensureWinebusDurationPatchOnce). No native
      # shim is built or shipped; nothing is added to LD_PRELOAD.

      - name: Sync Explore What's New from release notes
        # Regenerates explore/bh_explore.json's hero "What's New" block from the
        # README "What's new in <ver>" section, so the in-app What's New matches
        # the release notes without hand-editing two places.
        # MUST run BEFORE "Stamp Explore version": that step mirrors the manifest
        # into patches/.../bh_explore.json (the baked-into-APK asset), so the body
        # has to be fresh first — otherwise the APK ships the new version/build
        # number with the PREVIOUS release's body. Fail-safe: leaves the manifest
        # untouched (exit 0) if the notes format changes.
        run: python3 explore/gen_whatsnew.py

      - name: Stamp Explore version
        # Writes the INSTALLED version into patches/.../explore/bh_version.json
        # (bundled into the APK by ExploreVersionAssetPatch as assets/bh_version.json)
        # AND the LATEST version into explore/bh_explore.json's root, then mirrors
        # the (already What's-New-synced) manifest into the baked APK asset. Runs
        # BEFORE the gradle build so the patch bundle picks up the freshly-stamped
        # asset. Fail-safe (exit 0) if the version can't be resolved.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 explore/stamp_version.py

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download base-apk-611 \
            --pattern "GameHub_6.1.1.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.1.1.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.1.1.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true
          # Live Explore manifest — attached as the bh_explore.json release asset
          # so installed apps fetch the latest stable's What's New / features via
          # releases/latest/download/bh_explore.json (see BhExploreManifest).
          cp explore/bh_explore.json shared/ 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v6
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # APK filename is computed in "Apply patches" from needs.build.outputs.version
        # + matrix.variant.name, so no per-variant `file:` column. Three labels share
        # the bare "BannerHub v6" tag (Normal, Normal-GHL, Original) — they install
        # side-by-side via different package names, same pattern as the two AnTuTu
        # variants which share "BannerHub v6 AnTuTu".
        variant:
          - { name: Optimized,       pkg: "com.xj.herohuboptimized",    label: "DeskHub ALPHA test v6 1.3.0" }
          - { name: Normal,          pkg: "banner.hub",                 label: "DeskHub ALPHA test v6 1.3.0" }
          - { name: Normal-GHL,      pkg: "gamehub.lite",               label: "DeskHub ALPHA test v6 1.3.0 (Lite)" }
          - { name: PuBG,            pkg: "com.tencent.ig",             label: "DeskHub ALPHA test v6 1.3.0 (PuBG)" }
          - { name: AnTuTu,          pkg: "com.antutu.ABenchMark",      label: "DeskHub ALPHA test v6 1.3.0 (AnTuTu)" }
          - { name: alt-AnTuTu,      pkg: "com.antutu.benchmark.full",  label: "DeskHub ALPHA test v6 1.3.0 (alt-AnTuTu)" }
          - { name: PuBG-CrossFire,  pkg: "com.tencent.tmgp.cf",        label: "DeskHub ALPHA test v6 1.3.0 (CrossFire)" }
          - { name: Ludashi,         pkg: "com.ludashi.aibench",        label: "DeskHub ALPHA test v6 1.3.0 (Ludashi)" }
          - { name: Genshin,         pkg: "com.miHoYo.GenshinImpact",   label: "DeskHub ALPHA test v6 1.3.0 (Genshin)" }
          - { name: Original,        pkg: "com.xiaoji.egggame",         label: "DeskHub ALPHA test v6 1.3.0" }
    steps:
      - name: Checkout
        # Needed so the apksigner step can read keystore/bannerhub.keystore.
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v7
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: DeskHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          # Values are wrapped in JSON-string quotes so picocli's
          # Map<String,Object> parser doesn't try to coerce them as
          # numbers (e.g. "com.tencent.tmgp.cf" — the trailing 'f' is
          # parsed as a Java float suffix and triggers NumberFormatException
          # before the patch ever runs). The quotes also make values with
          # spaces (e.g. "DeskHub ALPHA test v6 1.3.0") a non-issue.
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.1.1.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            -d "Strip cloud gaming" \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with DeskHub test key (v1+v2+v3)
        env:
          FILENAME: DeskHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
        run: |
          set -e
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/DeskHub-V6-${{ needs.build.outputs.version }}-Patched-${{ matrix.variant.name }}.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    if: always() && needs.build.result == 'success' && needs.patch.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v7
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v7
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List release files
        run: |
          echo "=== APKs ==="
          ls -la apks/
          echo "=== rvp ==="
          ls -la shared/*.rvp 2>/dev/null || true
          echo "=== rve ==="
          ls -la shared/rve/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: DeskHub ALPHA test v6 ${{ needs.build.outputs.version }}
          body: |
            ## DeskHub ALPHA test v6 ${{ needs.build.outputs.version }}

            ### DeskHub High-Performance GameHub 6.1.1 ReVanced Runtime
            - **App Name**: DeskHub ALPHA test v6 1.3.0
            - **Version**: ${{ needs.build.outputs.version }} (1.3.0)
            - **Architecture**: Low-level Rust Core (Zero-Copy VFS & SPSC input queue), Native AAudio stream with NEON SIMD resampling, Vulkan 1.3/1.4 DXVK async shader compilation and persistent VkPipelineCache.
          files: |
            apks/DeskHub-V6-*.apk
            shared/*.rvp
            shared/rve/*.rve
            shared/bh_explore.json
