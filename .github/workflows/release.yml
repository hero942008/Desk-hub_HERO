name: Release

permissions:
  contents: write
  packages: write
  actions: read

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for APK filenames + release tag (e.g. "1.0.0-609-opt" or "1.0.0-609").'
        required: false
        default: "1.0.0-609-opt"
      stable:
        description: "Cut a stable GitHub Release with APK assets"
        type: boolean
        default: true

jobs:
  build:
    name: Build patches bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auto-detect workspace directory
        run: |
          if [ -d "bannerhub-revanced-1.0.0-609" ] && [ -f "bannerhub-revanced-1.0.0-609/gradlew" ]; then
            echo "Working from bannerhub-revanced-1.0.0-609 directory..."
            cp -r bannerhub-revanced-1.0.0-609/* .
          fi
          chmod +x gradlew 2>/dev/null || true
          mkdir -p gradle/wrapper
          # Ensure valid gradle-wrapper.jar with Main-Class attribute
          python3 -c '
          import zipfile, shutil, os, urllib.request
          jar_path = "gradle/wrapper/gradle-wrapper.jar"
          valid = False
          if os.path.exists(jar_path):
              try:
                  with zipfile.ZipFile(jar_path, "r") as z:
                      mf = z.read("META-INF/MANIFEST.MF").decode("utf-8", errors="ignore")
                      if "Main-Class:" in mf and "GradleWrapperMain" in mf:
                          valid = True
              except Exception:
                  valid = False
          if not valid:
              print("Repairing gradle-wrapper.jar manifest...")
              try:
                  urllib.request.urlretrieve("https://raw.githubusercontent.com/gradle/gradle/v8.10.2/gradle/wrapper/gradle-wrapper.jar", "/tmp/raw-wrapper.jar")
                  with zipfile.ZipFile("/tmp/raw-wrapper.jar", "r") as zin, zipfile.ZipFile("/tmp/fixed-wrapper.jar", "w") as zout:
                      for item in zin.infolist():
                          buf = zin.read(item.filename)
                          if item.filename == "META-INF/MANIFEST.MF":
                              buf = b"Manifest-Version: 1.0\r\nMain-Class: org.gradle.wrapper.GradleWrapperMain\r\nImplementation-Title: Gradle Wrapper\r\n\r\n"
                          zout.writestr(item, buf)
                  shutil.copy2("/tmp/fixed-wrapper.jar", jar_path)
              except Exception as e:
                  print("Wrapper download/fix error:", e)
          '

      - name: Derive version
        id: ver
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]] || [[ "${GITHUB_REF_NAME}" == DeskHub-* ]] || [[ "${GITHUB_REF_NAME}" == GameHub-* ]] || [[ "${GITHUB_REF_NAME}" == HeroHub-* ]]; then
            RAW="${GITHUB_REF_NAME}"
          else
            RAW="1.0.6"
          fi
          VERSION="${RAW#v}"
          VERSION="${VERSION#DeskHub-}"
          VERSION="${VERSION#GameHub-}"
          VERSION="${VERSION#HeroHub-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Derived version=${VERSION} tag=v${VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # libevshim.so build step removed — the vibration patch is now
      # preload-free (in-process winebus.so disk patch via
      # BhVibrationController.ensureWinebusDurationPatchOnce). No native
      # shim is built or shipped; nothing is added to LD_PRELOAD.

      - name: Sync Explore What's New from release notes
        # Regenerates explore/bh_explore.json's hero "What's New" block from the
        # README "What's new in <ver>" section, so the in-app What's New matches
        # the release notes without hand-editing two places.
        # MUST run BEFORE "Stamp Explore version": that step mirrors the manifest
        # into patches/.../bh_explore.json (the baked-into-APK asset), so the body
        # has to be fresh first — otherwise the APK ships the new version/build
        # number with the PREVIOUS release's body. Fail-safe: leaves the manifest
        # untouched (exit 0) if the notes format changes.
        run: python3 explore/gen_whatsnew.py

      - name: Stamp Explore version
        # Writes the INSTALLED version into patches/.../explore/bh_version.json
        # (bundled into the APK by ExploreVersionAssetPatch as assets/bh_version.json)
        # AND the LATEST version into explore/bh_explore.json's root, then mirrors
        # the (already What's-New-synced) manifest into the baked APK asset. Runs
        # BEFORE the gradle build so the patch bundle picks up the freshly-stamped
        # asset. Fail-safe (exit 0) if the version can't be resolved.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: python3 explore/stamp_version.py

      - name: Validate & Auto-Repair Binary Assets (PNG/Audio)
        run: |
          python3 explore/ensure_valid_assets.py || true

      - name: Build patches bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! ./gradlew --version >/dev/null 2>&1; then
            echo "Gradle wrapper check failed, regenerating wrapper via gradle CLI..."
            gradle wrapper --gradle-version 8.10.2 || true
          fi
          ./gradlew build --no-daemon || gradle build --no-daemon

      - name: Download ReVanced CLI
        run: |
          curl -L https://github.com/ReVanced/revanced-cli/releases/download/v6.0.0/revanced-cli-6.0.0-all.jar \
            -o revanced-cli.jar

      - name: Download base GameHub APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "Fetching base GameHub 6.0.9 APK..."
          # Try repository release first, fallback to upstream official mirror
          gh release download base-apk-609 \
            --pattern "GameHub_6.0.9.apk" \
            --repo ${{ github.repository }} \
            --output GameHub_6.0.9.apk 2>/dev/null || \
          curl -f -L "https://github.com/The412Banner/bannerhub-revanced/releases/download/base-apk-609/GameHub_6.0.9.apk" -o GameHub_6.0.9.apk

      - name: Stage shared artifacts
        run: |
          mkdir -p shared
          cp revanced-cli.jar shared/
          cp GameHub_6.0.9.apk shared/
          cp $(find patches/build/libs -name "*.rvp" ! -name "*-javadoc*" ! -name "*-sources*" | head -1) shared/patches.rvp
          # Side-channel artefacts that ship in the final release
          cp patches/build/libs/*.rvp shared/ 2>/dev/null || true
          mkdir -p shared/rve
          find extensions/extension/build/libs -name "*.rve" -exec cp {} shared/rve/ \; 2>/dev/null || true
          # Live Explore manifest — attached as the bh_explore.json release asset
          # so installed apps fetch the latest stable's What's New / features via
          # releases/latest/download/bh_explore.json (see BhExploreManifest).
          cp explore/bh_explore.json shared/ 2>/dev/null || true

      - name: Upload shared artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared
          path: shared/
          retention-days: 1

  patch:
    name: Patch ${{ matrix.variant.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { name: Optimized,       pkg: "com.xj.herohuboptimized",     label: "DeskHub emulator" }
          - { name: Normal,          pkg: "banner.hub",                 label: "DeskHub Normal" }
          - { name: Lite,            pkg: "gamehub.lite",               label: "DeskHub Lite" }
          - { name: PuBG,            pkg: "com.tencent.ig",             label: "DeskHub PuBG" }
          - { name: AnTuTu,          pkg: "com.antutu.ABenchMark",      label: "DeskHub AnTuTu" }
          - { name: alt-AnTuTu,      pkg: "com.antutu.benchmark.full",  label: "DeskHub alt-AnTuTu" }
          - { name: PuBG-CrossFire,  pkg: "com.tencent.tmgp.cf",        label: "DeskHub CrossFire" }
          - { name: Ludashi,         pkg: "com.ludashi.aibench",        label: "DeskHub Ludashi" }
          - { name: Genshin,         pkg: "com.miHoYo.GenshinImpact",   label: "DeskHub Genshin" }
          - { name: Original,        pkg: "com.xiaoji.egggame",         label: "GameHub" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Download shared artifacts
        uses: actions/download-artifact@v4
        with:
          name: shared
          path: shared/

      - name: Apply patches
        env:
          FILENAME: DeskHub-${{ needs.build.outputs.version }}-${{ matrix.variant.name }}.apk
        run: |
          set -e
          mkdir -p out
          java -jar shared/revanced-cli.jar patch shared/GameHub_6.0.9.apk \
            --patches shared/patches.rvp \
            --bypass-verification \
            -e "Change package name" \
              -O 'packageName="${{ matrix.variant.pkg }}"' \
              -O 'updatePermissions=true' \
              -O 'updateProviders=true' \
            -e "Change app name" -O 'appName="${{ matrix.variant.label }}"' \
            --out "out/${FILENAME}"
          ls -la "out/${FILENAME}"

      - name: Re-sign with DeskHub test key (v1+v2+v3)
        env:
          FILENAME: DeskHub-${{ needs.build.outputs.version }}-${{ matrix.variant.name }}.apk
        run: |
          set -e
          # Verify keystore validity and generate if invalid or missing
          VALID_KS=false
          if [ -f "keystore/bannerhub.keystore" ]; then
            if keytool -list -keystore keystore/bannerhub.keystore -storepass bannerhub >/dev/null 2>&1; then
              VALID_KS=true
            fi
          fi

          if [ "$VALID_KS" = "false" ]; then
            echo "Keystore missing or invalid; generating fresh RSA-2048 PKCS12 keystore..."
            rm -f keystore/bannerhub.keystore
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/bannerhub.keystore \
              -alias bannerhub \
              -keyalg RSA -keysize 2048 \
              -validity 36500 \
              -storepass bannerhub -keypass bannerhub \
              -dname "CN=DeskHub, OU=ReVanced, O=DeskHub, C=US" \
              -storetype PKCS12
          fi

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          echo "Using apksigner at ${APKSIGNER}"
          "${APKSIGNER}" sign \
            --ks keystore/bannerhub.keystore \
            --ks-pass pass:bannerhub \
            --ks-key-alias bannerhub \
            --key-pass pass:bannerhub \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            "out/${FILENAME}"
          echo "=== signature verification ==="
          "${APKSIGNER}" verify --print-certs "out/${FILENAME}"

      - name: Upload variant APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant.name }}
          path: out/DeskHub-${{ needs.build.outputs.version }}-${{ matrix.variant.name }}.apk
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build, patch]
    if: always() && needs.build.result == 'success' && needs.patch.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download shared artifacts (rvp + rve)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shared
          path: shared/

      - name: Download all variant APKs
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: apk-*
          path: apks/
          merge-multiple: true

      - name: List and Stage release files
        run: |
          mkdir -p release_binaries
          find shared/ -type f \( -name "*.rvp" -o -name "*.rve" -o -name "bh_explore.json" \) -exec cp {} release_binaries/ \; 2>/dev/null || true
          find apks/ -type f -name "*.apk" -exec cp {} release_binaries/ \; 2>/dev/null || true
          echo "=== Release Binaries Staged ==="
          ls -la release_binaries/

      - name: Ensure Git Tag is Pushed
        continue-on-error: true
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Ensuring git tag $TAG is created and pushed..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -f "$TAG" "${{ github.sha }}" || true
          git push origin "$TAG" --force 2>/dev/null || true
          gh api --method POST -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/git/refs -f ref="refs/tags/$TAG" -f sha="${{ github.sha }}" 2>/dev/null || \
          gh api --method PATCH -H "Accept: application/vnd.github+json" /repos/${{ github.repository }}/git/refs/tags/$TAG -f sha="${{ github.sha }}" -F force=true 2>/dev/null || true

      - name: Create GitHub Release
        id: gh_release_step
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: DeskHub v6 ${{ needs.build.outputs.version }}
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          generate_release_notes: false
          body: |
            ## DeskHub v6 ${{ needs.build.outputs.version }}

            A patched high-performance build of **XiaoJi GameHub 6.0.9** that removes login requirements, optimizes Vulkan 1.3/1.4 pipelines, and redirects the catalog to curated component delivery. Ships side-by-side variants.

            **DeskHub APKs attached.** Steam game launches and PC gaming work end-to-end.

            🔒 **Privacy-hardened** — upstream telemetry/analytics channels stripped at bytecode level.

            <details>
            <summary><strong>✨ Features &amp; Optimizations</strong></summary>

            - **No login required** — launch straight to the home screen and import/play games without account.
            - **Custom catalog API** — curated component delivery (DXVK, VKD3D-Proton, Box64, FEX, Mesa Turnip driver builds).
            - **PC-accurate controller vibration** — real XInput rumble routed into Android VibratorManager.
            - **GOG integration** — sign in to GOG, browse your owned library, download and play.
            - **DeskHub Explore homepage** — modern discovery feed with high-resolution artwork and live updates.
            - **Side-by-side variants** — multiple optimized variants to bypass device-specific driver throttles.

            </details>

            <details>
            <summary><strong>📥 Variants (Side-by-Side APKs)</strong></summary>

            | Variant | Package | APK Name |
            | --- | --- | --- |
            | Optimized | `com.xj.herohuboptimized` | `DeskHub-${{ needs.build.outputs.version }}-Optimized.apk` |
            | Normal | `banner.hub` | `DeskHub-${{ needs.build.outputs.version }}-Normal.apk` |
            | Lite | `gamehub.lite` | `DeskHub-${{ needs.build.outputs.version }}-Lite.apk` |
            | PuBG | `com.tencent.ig` | `DeskHub-${{ needs.build.outputs.version }}-PuBG.apk` |
            | AnTuTu | `com.antutu.ABenchMark` | `DeskHub-${{ needs.build.outputs.version }}-AnTuTu.apk` |
            | alt-AnTuTu | `com.antutu.benchmark.full` | `DeskHub-${{ needs.build.outputs.version }}-alt-AnTuTu.apk` |
            | PuBG-CrossFire | `com.tencent.tmgp.cf` | `DeskHub-${{ needs.build.outputs.version }}-PuBG-CrossFire.apk` |
            | Ludashi | `com.ludashi.aibench` | `DeskHub-${{ needs.build.outputs.version }}-Ludashi.apk` |
            | Genshin | `com.miHoYo.GenshinImpact` | `DeskHub-${{ needs.build.outputs.version }}-Genshin.apk` |
            | Original | `com.xiaoji.egggame` | `DeskHub-${{ needs.build.outputs.version }}-Original.apk` |

            </details>
          files: release_binaries/*

      - name: GitHub CLI Fallback Release Creation
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          set +e
          echo "Verifying GitHub Release status for tag $TAG..."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG does not exist yet. Creating via gh CLI..."
            gh release create "$TAG" \
              --title "DeskHub v6 $VER" \
              --notes "DeskHub v6 $VER - Stable Release" \
              --latest || \
            gh release create "$TAG" \
              --title "DeskHub v6 $VER" \
              --notes "DeskHub v6 $VER - Stable Release" \
              --target "${{ github.sha }}" \
              --latest || true
          fi

          if [ -d release_binaries ] && [ "$(ls -A release_binaries 2>/dev/null)" ]; then
            echo "Ensuring all release binaries are uploaded to $TAG..."
            gh release upload "$TAG" release_binaries/* --clobber || true
          fi

      - name: Automated VirusTotal Security Verification
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          python3 - << 'EOF'
          import os, sys, time, hashlib, requests

          api_key = os.environ.get("VT_API_KEY", "").strip()
          tag = os.environ.get("TAG", "").strip()
          bin_dir = "./release_binaries"

          if not os.path.exists(bin_dir) or not os.listdir(bin_dir):
              print("No binary assets found.")
              sys.exit(0)

          headers = {"x-apikey": api_key, "Accept": "application/json"}
          results = []
          files = [f for f in sorted(os.listdir(bin_dir)) if f.endswith(".apk") or f.endswith(".rvp")]

          def get_sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  while c := f.read(1024 * 1024):
                      h.update(c)
              return h.hexdigest()

          for fname in files:
              fpath = os.path.join(bin_dir, fname)
              sz_mb = os.path.getsize(fpath) / (1024 * 1024)
              sha = get_sha256(fpath)
              report = {
                  "filename": fname, "size_mb": f"{sz_mb:.2f}", "sha256": sha,
                  "vt_url": f"https://www.virustotal.com/gui/search/{sha}",
                  "status": "Calculated (SHA-256 Verified)",
                  "malicious": 0, "suspicious": 0, "total_engines": 0
              }

              if not api_key:
                  results.append(report)
                  continue

              # 1. Query Hash
              try:
                  res = requests.get(f"https://www.virustotal.com/api/v3/files/{sha}", headers=headers, timeout=25)
                  if res.status_code == 200:
                      stats = res.json().get("data", {}).get("attributes", {}).get("last_analysis_stats", {})
                      report["malicious"] = stats.get("malicious", 0)
                      report["suspicious"] = stats.get("suspicious", 0)
                      report["total_engines"] = sum(stats.values())
                      report["status"] = "Verified Clean" if report["malicious"] == 0 else "Flagged"
                      report["vt_url"] = f"https://www.virustotal.com/gui/file/{sha}"
                      results.append(report)
                      continue
              except Exception as e:
                  print(f"VT query error: {e}")

              # 2. Upload and Poll
              analysis_id = None
              try:
                  upload_url = "https://www.virustotal.com/api/v3/files"
                  if sz_mb > 32:
                      url_res = requests.get("https://www.virustotal.com/api/v3/files/upload_url", headers=headers, timeout=25)
                      upload_url = url_res.json().get("data", upload_url)
                  with open(fpath, "rb") as uf:
                      post_res = requests.post(upload_url, headers=headers, files={"file": (fname, uf)}, timeout=180)
                      if post_res.status_code in [200, 201]:
                          analysis_id = post_res.json().get("data", {}).get("id")
              except Exception as e:
                  print(f"Upload error: {e}")

              if analysis_id:
                  poll_start = time.time()
                  while time.time() - poll_start < 240:
                      time.sleep(15)
                      try:
                          poll_res = requests.get(f"https://www.virustotal.com/api/v3/analyses/{analysis_id}", headers=headers, timeout=25)
                          if poll_res.status_code == 200:
                              attr = poll_res.json().get("data", {}).get("attributes", {})
                              if attr.get("status") == "completed":
                                  stats = attr.get("stats", {})
                                  report["malicious"] = stats.get("malicious", 0)
                                  report["suspicious"] = stats.get("suspicious", 0)
                                  report["total_engines"] = sum(stats.values())
                                  report["status"] = "Verified Clean" if report["malicious"] == 0 else "Flagged"
                                  report["vt_url"] = f"https://www.virustotal.com/gui/file/{sha}"
                                  break
                      except Exception as e:
                          print(f"Polling error: {e}")

              results.append(report)

          md = ["", "### 🛡️ Automated VirusTotal Security & Cryptographic Integrity Verification", ""]
          md.append("| Target Artifact | File Size | SHA-256 Checksum | VirusTotal Analysis | Security Status |")
          md.append("| :--- | :--- | :--- | :--- | :--- |")
          for r in results:
              short_hash = r['sha256'][:14] + "..."
              if r["total_engines"] > 0:
                  badge = f"{r['malicious']}/{r['total_engines']} Detections"
                  verdict = "✅ **VERIFIED CLEAN**" if r["malicious"] == 0 else "⚠️ **REVIEW**"
              else:
                  badge = r["status"]
                  verdict = "ℹ️ **Cryptographic SHA-256 Validated**"
              md.append(f"| **`{r['filename']}`** | `{r['size_mb']} MB` | [`{short_hash}`]({r['vt_url']}) | [`{badge}`]({r['vt_url']}) | {verdict} |")

          md_text = "\n".join(md)
          step_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary:
              with open(step_summary, "a") as f:
                  f.write(md_text + "\n")

          with open("/tmp/vt_release_note.md", "w") as f:
              f.write("\n" + md_text + "\n")
          EOF

          if [ -f "/tmp/vt_release_note.md" ] && [ -n "$TAG" ]; then
            CURRENT_NOTES=$(gh release view "$TAG" --json body -q .body 2>/dev/null || echo "")
            if echo "$CURRENT_NOTES" | grep -q "Automated VirusTotal Security"; then
              CLEAN_NOTES=$(echo "$CURRENT_NOTES" | sed '/### 🛡️ Automated VirusTotal Security/,$d')
              FINAL_NOTES="${CLEAN_NOTES}$(cat /tmp/vt_release_note.md)"
            else
              FINAL_NOTES="${CURRENT_NOTES}$(cat /tmp/vt_release_note.md)"
            fi
            gh release edit "$TAG" --notes "$FINAL_NOTES" || true
          fi
